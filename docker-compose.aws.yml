# Production API on the same EC2 as kalke-auth (Neon + Upstash).
# Image is built in GitHub Actions and pulled from GHCR (EC2 disk is tight).
#
#   cp prod.env.example prod.env   # once / or CI syncs secrets
#   make aws-up
#
services:
  api:
    image: ${EBANK_IMAGE:-ghcr.io/kalke/e-bank-api:latest}
    container_name: ebank-api
    restart: unless-stopped
    env_file:
      - prod.env
    environment:
      ENV: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      OIDC_ENABLED: "true"
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.kalke.dev/realms/kalke}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-e-bank-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kalke.dev,https://www.kalke.dev}
      IDEMPOTENCY_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RESET_ENABLED: "false"
      LEGACY_CHALLENGE_ROUTES: "false"
    expose:
      - "8000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - kalke-auth

networks:
  kalke-auth:
    external: true
    name: kalke-auth_default
