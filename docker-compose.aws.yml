# Postgres is Docker-only — do not publish :5432.
# Static IP 172.18.10.11 for Cloudflare WARP / DBeaver (WARP required).
services:
  ebank-db:
    image: postgres:18-alpine
    container_name: ebank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-ebank}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=128MB
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 192m
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /kalke/e-bank-api
        awslogs-create-group: "true"
    networks:
      kalke-auth:
        ipv4_address: 172.18.10.11

  api:
    image: ${EBANK_IMAGE:-ghcr.io/kalke/e-bank-api:latest}
    container_name: ebank-api
    restart: unless-stopped
    depends_on:
      ebank-db:
        condition: service_healthy
    env_file:
      - prod.env
    environment:
      ENV: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      SERVICE_NAME: e-bank-api
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SECRET_ID: ${EBANK_SECRET_ID:-kalke/e-bank-api/prod}
      # Bucket comes from prod.env / Secrets Manager — do not blank it with ${VAR:-}.
      OIDC_ENABLED: "true"
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.kalke.dev/realms/kalke}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-e-bank-api}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://auth:8081/realms/kalke}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://kalke.dev,https://www.kalke.dev}
      IDEMPOTENCY_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      RESET_ENABLED: "false"
      LEGACY_CHALLENGE_ROUTES: "false"
      POSTGRES_USER: ${POSTGRES_USER:-ebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-ebank}
      # Compose wins over Secrets Manager (load_secrets_into_env does not overwrite).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ebank}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in prod.env}@ebank-db:5432/${POSTGRES_DB:-ebank}
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-1}
        awslogs-group: /kalke/e-bank-api
        awslogs-create-group: "true"
    expose:
      - "8000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - kalke-auth

networks:
  kalke-auth:
    external: true
    name: kalke-auth_default

volumes:
  pgdata:
