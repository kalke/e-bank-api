[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Explicit select — ruff>=0.16 defaults are too broad for this codebase.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # Depends()/Query() in defaults — FastAPI idiom
    "B905",    # zip(strict=) — prefer current call sites
    "SIM108",  # ternary vs if/else — readability preference
    "COM812",  # vírgula final (conflita com o formatter)
    "ISC001",  # concatenação implícita de strings (conflita com o formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert em testes
"app/main.py" = ["E402", "I001"]  # secrets load before settings/logging imports

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
