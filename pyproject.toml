[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "D",       # docstrings (módulo, classe, função, etc.)
    "ANN",     # type hints obrigatórios
    "B008",    # Depends()/Query() in defaults — FastAPI idiom
    "COM812",  # vírgula final (conflita com o formatter)
    "ISC001",  # concatenação implícita de strings (conflita com o formatter)
    "N818",    # exceções devem terminar em Error
    "ERA001",  # código comentado
    "FIX",     # comentários FIXME
    "TD",      # comentários TODO
    "T20",     # print / breakpoint
    "PLR2004", # valores "mágicos" em comparações
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert em testes

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
