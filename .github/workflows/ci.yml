name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make setup
      - run: make lint-ci
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ebank
          POSTGRES_PASSWORD: ebank
          POSTGRES_DB: ebank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ebank:ebank@localhost:5432/ebank_test
      REDIS_URL: redis://localhost:6379/0
      OIDC_ENABLED: "false"
      LEGACY_CHALLENGE_ROUTES: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make setup
      - run: make migrate
      - run: make test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        run: |
          IMAGE="ghcr.io/kalke/e-bank-api"
          TAG="${GITHUB_SHA}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: [lint, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, pde-ec2]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Ensure repo checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /home/ubuntu/e-bank-api
        run: |
          set -euo pipefail
          if [[ -d "${REPO_DIR}/.git" ]]; then
            cd "${REPO_DIR}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/kalke/e-bank-api.git"
            git fetch --depth=1 origin main
            git checkout -B main FETCH_HEAD
            git remote set-url origin "https://github.com/kalke/e-bank-api.git"
          else
            tmp=""
            if [[ -f "${REPO_DIR}/prod.env" ]]; then
              tmp="$(mktemp)"
              cp "${REPO_DIR}/prod.env" "${tmp}"
            fi
            rm -rf "${REPO_DIR}"
            git clone "https://x-access-token:${GH_TOKEN}@github.com/kalke/e-bank-api.git" "${REPO_DIR}"
            git -C "${REPO_DIR}" remote set-url origin "https://github.com/kalke/e-bank-api.git"
            if [[ -n "${tmp}" ]]; then
              cp "${tmp}" "${REPO_DIR}/prod.env"
              rm -f "${tmp}"
            fi
          fi

      - name: Sync prod.env from GitHub secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OIDC_ISSUER: ${{ secrets.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ secrets.OIDC_AUDIENCE }}
          M2M_USER_FORWARD_SECRET: ${{ secrets.M2M_USER_FORWARD_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path.home() / "e-bank-api" / "prod.env"
          def q(v: str) -> str:
              return "'" + v.replace("'", "'\"'\"'") + "'"
          required = ("DATABASE_URL", "REDIS_URL", "M2M_USER_FORWARD_SECRET")
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit(f"missing secrets: {', '.join(missing)}")
          rows = {
              "ENV": "production",
              "LOG_LEVEL": "INFO",
              "SERVICE_NAME": "e-bank-api",
              "RESET_ENABLED": "false",
              "LEGACY_CHALLENGE_ROUTES": "false",
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "REDIS_URL": os.environ["REDIS_URL"],
              "IDEMPOTENCY_ENABLED": "true",
              "IDEMPOTENCY_EXCLUDE_PATHS": "/health,/ready,/metrics",
              "RATE_LIMIT_ENABLED": "true",
              "RATE_LIMIT_REQUESTS": "60",
              "RATE_LIMIT_WINDOW_SECONDS": "60",
              "OIDC_ENABLED": "true",
              "OIDC_ISSUER": os.environ.get("OIDC_ISSUER") or "https://auth.kalke.dev/realms/kalke",
              "OIDC_AUDIENCE": os.environ.get("OIDC_AUDIENCE") or "e-bank-api",
              "M2M_USER_FORWARD_SECRET": os.environ["M2M_USER_FORWARD_SECRET"],
              "WELCOME_AMOUNT": "10000.00",
              "WELCOME_CURRENCY": "USD",
              "MAX_TRANSFER_AMOUNT": "10000.00",
              "MAX_WITHDRAW_AMOUNT": "10000.00",
              "CORS_ORIGINS": "https://kalke.dev,https://www.kalke.dev",
          }
          path.write_text("".join(f"{k}={q(v)}\n" for k, v in rows.items()))
          print(f"wrote {path}")
          PY

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and restart
        working-directory: /home/ubuntu/e-bank-api
        env:
          EBANK_IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          set -euo pipefail
          export EBANK_IMAGE
          make aws-up
          make aws-ps
